name: SellerKit backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/sellerkit-backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/sellerkit-backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check backend/index.js
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check function startup, health, CORS
        working-directory: backend
        run: node --test smoke.test.mjs
